<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu pedido · TAKTO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070707">
  <link rel="icon" href="assets/img/marca/icono.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/takto.css">
</head>
<body>
  <section class="final" style="min-height:100vh;display:flex;align-items:center">
    <div class="container" id="result"></div>
  </section>

  <script src="assets/js/catalog.js"></script>
  <script>
    (function () {
      var C = window.CATALOG;
      var q = new URLSearchParams(location.search);
      var status = q.get("status") || q.get("collection_status");
      var ref = (q.get("external_reference") || "").replace(/[^A-Z0-9-]/gi, "");
      var wa = "https://wa.me/" + C.brand.whatsapp + "?text=" +
        encodeURIComponent("Hola, acabo de hacer mi pedido" + (ref ? " " + ref : "") + ".");
      var el = document.getElementById("result");
      var isPay = ref.indexOf("TP-") === 0;
      var back = '<a class="btn btn-line" href="' + (isPay ? "/pay/" : "/") + '">Volver a ' + C.brand.name + (isPay ? " Pay" : "") + "</a>";
      var waBtn = '<a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>';

      function clearOrder() {
        try {
          var s = JSON.parse(localStorage.getItem("takto_state_v3") || "{}");
          s.cart = [];
          localStorage.setItem("takto_state_v3", JSON.stringify(s));
        } catch (e) {}
      }

      if (status === "approved") {
        clearOrder();
        el.innerHTML = '<span class="eyebrow">Pago aprobado</span><h2>¡Gracias por tu compra!</h2>' +
          '<p class="lead" style="margin:0 auto">' + (ref ? "Pedido <strong>" + ref + "</strong>. " : "") +
          "Te escribimos por WhatsApp para coordinar tu entrega y programar tus tarjetas.</p>" +
          '<div class="hero-cta">' + waBtn + back + "</div>";
      } else if (status === "pending" || status === "in_process") {
        clearOrder();
        el.innerHTML = '<span class="eyebrow">Pago pendiente</span><h2>Estamos esperando tu pago.</h2>' +
          '<p class="lead" style="margin:0 auto">Si pagaste en OXXO o por transferencia, puede tardar en acreditarse. Te avisamos en cuanto se confirme.</p>' +
          '<div class="hero-cta">' + back + "</div>";
      } else {
        el.innerHTML = '<span class="eyebrow">Pago no completado</span><h2>No se hizo ningún cargo.</h2>' +
          '<p class="lead" style="margin:0 auto">Tu paquete sigue guardado. Puedes intentarlo de nuevo o pedir por WhatsApp.</p>' +
          '<div class="hero-cta"><a class="btn btn-primary" href="/#productos">Volver a la tienda</a>' + waBtn + "</div>";
      }
    })();
  </script>
</body>
</html>
