<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gracias por tu compra · TapReview MX</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div data-header></div>

  <main class="container">
    <div class="empty" id="result"></div>
  </main>

  <div data-footer></div>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    (function () {
      var C = window.CATALOG, S = window.STORE, esc = S.escapeHtml;
      var q = new URLSearchParams(location.search);
      var status = q.get("status") || q.get("collection_status");
      var ref = q.get("external_reference") || "";
      var wa = "https://wa.me/" + C.config.whatsapp + "?text=" +
        encodeURIComponent("Hola, acabo de hacer mi pedido" + (ref ? " " + ref : "") + ". Les envío mi información.");
      var el = document.getElementById("result");

      if (status === "approved") {
        S.clear();
        el.innerHTML = "<h1>¡Gracias por tu compra!</h1>" +
          "<p>Tu pago fue aprobado" + (ref ? " · Pedido <strong>" + esc(ref) + "</strong>" : "") + ". Te enviaremos la guía de rastreo por correo.</p>" +
          '<p>Si tu placa es personalizada, mándanos tu logo por WhatsApp.</p><a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>';
      } else if (status === "pending" || status === "in_process") {
        S.clear();
        el.innerHTML = "<h1>Tu pago está pendiente</h1>" +
          "<p>Si pagaste en OXXO o por transferencia, el pago puede tardar en acreditarse. Te avisaremos por correo cuando se confirme.</p>" +
          '<a class="btn btn-ghost" href="index.html">Volver a la tienda</a>';
      } else {
        el.innerHTML = "<h1>El pago no se completó</h1>" +
          "<p>No se realizó ningún cargo. Tus productos siguen en el carrito.</p>" +
          '<a class="btn btn-primary" href="carrito.html">Volver al carrito</a> <a class="btn btn-wa" href="' + wa + '" target="_blank" rel="noopener">Pedir por WhatsApp</a>';
      }
    })();
  </script>
</body>
</html>
