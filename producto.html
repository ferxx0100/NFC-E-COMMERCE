<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto · TapReview MX</title>
  <meta name="description" content="Placa NFC para reseñas de Google y redes sociales.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <div data-header></div>

  <main class="container">
    <nav class="breadcrumb"><a href="index.html">Inicio</a> / <a href="index.html#productos">Productos</a> / <span id="crumb"></span></nav>

    <div class="pdp">
      <div>
        <div class="gallery-main" id="gallery-main"></div>
        <div class="thumbs" id="thumbs"></div>
      </div>

      <form class="pdp-info" id="buy-form" novalidate>
        <h1 id="p-name" style="font-size:clamp(1.7rem,3.4vw,2.4rem)"></h1>
        <p class="lead" id="p-tagline"></p>
        <div class="price" id="p-price"></div>

        <div class="field">
          <span class="field-label">Plataforma</span>
          <div class="chips" id="platforms" role="group" aria-label="Plataforma"></div>
        </div>

        <div class="field">
          <label for="link">Enlace a programar en el chip</label>
          <input type="url" id="link" name="link" placeholder="https://" required>
          <div class="field-hint" id="link-hint">¿No tienes tu enlace a la mano? Déjalo vacío y escribe el nombre de tu negocio; nosotros lo buscamos.</div>
        </div>

        <div class="field">
          <label for="business">Nombre de tu negocio</label>
          <input type="text" id="business" name="business" maxlength="40" placeholder="Ej. Café La Esquina">
          <div class="field-hint" id="business-hint">Aparece en la vista previa. En las placas personalizadas lo imprimimos en el diseño.</div>
        </div>

        <div class="field" id="notes-field" hidden>
          <label for="notes">Indicaciones de diseño</label>
          <textarea id="notes" name="notes" rows="3" maxlength="400" placeholder="Colores, texto, formato (escritorio o adhesivo). Después de la compra te pediremos tu logo por WhatsApp."></textarea>
        </div>

        <div class="buy-row">
          <div class="qty">
            <button type="button" data-step="-1" aria-label="Menos">−</button>
            <input type="number" id="qty" value="1" min="1" max="999" aria-label="Cantidad">
            <button type="button" data-step="1" aria-label="Más">+</button>
          </div>
          <button type="submit" class="btn btn-primary">Agregar al carrito</button>
        </div>
        <div class="tier-note" id="tier-note"></div>
        <p class="form-error" id="buy-error" hidden></p>

        <div class="feature-list">
          <h3>Qué incluye</h3>
          <ul class="check-list" id="features"></ul>
        </div>
        <div class="feature-list">
          <h3>Descripción</h3>
          <p id="p-desc" style="color:var(--ink-2)"></p>
        </div>
      </form>
    </div>
  </main>

  <div data-footer></div>

  <script src="assets/js/catalog.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    (function () {
      var C = window.CATALOG, S = window.STORE, esc = S.escapeHtml;
      var id = new URLSearchParams(location.search).get("id");
      var p = C.getProduct(id) || C.products[0];
      var state = { platform: p.platforms[0], view: "preview" };
      var check = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5L20 7"/></svg>';

      var $ = function (sel) { return document.getElementById(sel); };
      var qtyInput = $("qty"), linkInput = $("link"), bizInput = $("business");

      document.title = p.name + " · " + C.config.storeName;
      $("crumb").textContent = p.name;
      $("p-name").textContent = p.name;
      $("p-tagline").textContent = p.tagline;
      $("p-desc").textContent = p.description;
      $("features").innerHTML = p.features.map(function (f) { return "<li>" + check + "<span>" + esc(f) + "</span></li>"; }).join("");
      $("notes-field").hidden = !p.custom;

      $("platforms").innerHTML = p.platforms.map(function (pid) {
        var pl = C.getPlatform(pid);
        return '<button type="button" class="chip" data-platform="' + pid + '" aria-pressed="' + (pid === state.platform) + '">' + esc(pl.name) + "</button>";
      }).join("");

      // Galería: la primera miniatura es la vista previa en vivo.
      function renderThumbs() {
        $("thumbs").innerHTML =
          '<button type="button" data-view="preview" aria-pressed="' + (state.view === "preview") + '">Vista previa</button>' +
          p.images.map(function (src, i) {
            return '<button type="button" data-view="' + i + '" aria-pressed="' + (state.view === String(i)) + '"><img src="' + src + '" alt=""></button>';
          }).join("");
      }

      function renderMain() {
        var main = $("gallery-main");
        if (state.view === "preview") {
          main.classList.add("is-preview");
          main.innerHTML = S.preview(state.platform, bizInput.value.trim(), p.shape);
        } else {
          main.classList.remove("is-preview");
          main.innerHTML = '<img src="' + p.images[+state.view] + '" alt="' + esc(p.name) + '">';
        }
      }

      function qty() {
        var n = parseInt(qtyInput.value, 10);
        return isNaN(n) ? 1 : Math.max(1, Math.min(999, n));
      }

      function renderPrice() {
        var n = qty(), unit = C.unitPrice(p, n), off = C.discountFor(n);
        $("p-price").innerHTML = "<strong>" + C.formatMoney(unit) + "</strong>" +
          (off ? "<s>" + C.formatMoney(p.price) + "</s>" : p.compareAt ? "<s>" + C.formatMoney(p.compareAt) + "</s>" : "") +
          '<span style="color:var(--muted);font-size:.9rem">por pieza</span>';

        var next = null;
        for (var i = 0; i < C.tiers.length; i++) if (C.tiers[i].min > n) { next = C.tiers[i]; break; }
        var msg = off ? "Tienes " + Math.round(off * 100) + "% de descuento por volumen. Total: " + C.formatMoney(unit * n) + "." : "";
        if (next) msg += (msg ? " " : "") + "Lleva " + next.min + " o más y ahorra " + Math.round(next.off * 100) + "%.";
        $("tier-note").textContent = msg;
        $("tier-note").hidden = !msg;
      }

      function renderPlatform() {
        var pl = C.getPlatform(state.platform);
        linkInput.placeholder = pl.placeholder;
        document.querySelectorAll("[data-platform]").forEach(function (b) {
          b.setAttribute("aria-pressed", b.dataset.platform === state.platform);
        });
      }

      $("platforms").addEventListener("click", function (e) {
        var b = e.target.closest("[data-platform]");
        if (!b) return;
        state.platform = b.dataset.platform;
        state.view = "preview";
        renderPlatform(); renderThumbs(); renderMain();
      });

      $("thumbs").addEventListener("click", function (e) {
        var b = e.target.closest("[data-view]");
        if (!b) return;
        state.view = b.dataset.view;
        renderThumbs(); renderMain();
      });

      bizInput.addEventListener("input", function () { if (state.view === "preview") renderMain(); });
      qtyInput.addEventListener("input", renderPrice);
      document.querySelectorAll("[data-step]").forEach(function (b) {
        b.addEventListener("click", function () { qtyInput.value = qty() + +b.dataset.step; qtyInput.value = qty(); renderPrice(); });
      });

      $("buy-form").addEventListener("submit", function (e) {
        e.preventDefault();
        var link = linkInput.value.trim(), biz = bizInput.value.trim(), err = $("buy-error");
        err.hidden = true;
        if (link && !/^https?:\/\/\S+\.\S+/i.test(link)) {
          err.textContent = "Revisa el enlace: debe empezar con https:// (por ejemplo " + C.getPlatform(state.platform).placeholder + ").";
          err.hidden = false; linkInput.focus(); return;
        }
        if (!link && !biz) {
          err.textContent = "Escribe el enlace a programar o, si no lo tienes, el nombre de tu negocio para buscarlo.";
          err.hidden = false; linkInput.focus(); return;
        }
        S.add({
          productId: p.id, platform: state.platform, link: link, businessName: biz,
          notes: p.custom ? $("notes").value.trim() : "", qty: qty(),
        });
        S.toast("Agregado al carrito ✓");
        setTimeout(function () { location.href = "carrito.html"; }, 700);
      });

      renderPlatform(); renderThumbs(); renderMain(); renderPrice();
    })();
  </script>
</body>
</html>
