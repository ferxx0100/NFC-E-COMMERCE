<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Plantillas de imágenes · TAKTO</title>
  <link rel="stylesheet" href="../assets/css/takto.css">
  <style>
    body { background: #000; margin: 0; }
    .art { position: relative; overflow: hidden; background: radial-gradient(900px 700px at 70% 25%, rgba(255,255,255,.07), transparent 60%), #0c0c0d; color: #f5f5f4; }
    .art.light { background: #f4f2ee; color: #141414; }
    .brand { position: absolute; top: 64px; left: 72px; display: flex; gap: 12px; align-items: center; font: 600 28px/1 var(--sans); letter-spacing: .3em; }
    .brand svg { width: 34px; height: 34px; }
    .tag { position: absolute; top: 56px; right: 72px; border: 1px solid currentColor; opacity: .7; border-radius: 999px; padding: 12px 22px; font: 500 22px/1 var(--sans); letter-spacing: .1em; }
    .copy { position: absolute; left: 72px; right: 72px; bottom: 88px; }
    .copy h2 { font-size: 84px; margin: 0 0 18px; }
    .copy p { font: 400 32px/1.4 var(--sans); color: #a1a1aa; margin: 0; }
    .light .copy p { color: #5c5c63; }
    .shadow { filter: drop-shadow(0 50px 70px rgba(0,0,0,.55)); }
    .solo { width: 100vw; height: 100vh; }
    .solo svg { width: 100%; height: 100%; }
    .post { width: 1080px; height: 1350px; }
    .post .one { position: absolute; left: 90px; right: 90px; top: 300px; transform: rotate(-6deg); }
    .post .one.v { left: 50%; right: auto; width: 440px; margin-left: -220px; top: 170px; }
    .post .copy.v { bottom: 70px; }
    .post .copy.v h2 { font-size: 76px; }
    .grid-v { position: absolute; left: 130px; right: 130px; top: 160px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; }
    .grid-h { position: absolute; left: 90px; right: 90px; top: 640px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
    .post .fan { position: absolute; left: 50%; top: 560px; }
    .post .fan > div { position: absolute; width: 640px; left: -320px; top: -200px; transform-origin: 50% 170%; }
    .grid { position: absolute; left: 120px; right: 120px; top: 150px; display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; }
    .grid span { display: block; text-align: center; font: 500 22px/1 var(--sans); color: #a1a1aa; margin-top: 14px; }
    .og { width: 1200px; height: 630px; }
    .og .one { position: absolute; width: 290px; right: 140px; top: 70px; transform: rotate(-8deg); }
    .og .copy { top: 190px; bottom: auto; width: 520px; }
    .og .copy h2 { font-size: 66px; }
    .og .copy p { font-size: 26px; }
    .reel { width: 1080px; height: 1920px; }
    .reel .nfc-scene { position: absolute; left: 150px; width: 780px; top: 330px; }
    .reel .copy { text-align: center; bottom: 160px; }
    .reel .copy h2 { font-size: 100px; }
    .reel .top { position: absolute; top: 210px; left: 0; right: 0; text-align: center; font: 500 30px/1 var(--sans); letter-spacing: .3em; color: #a1a1aa; }
  </style>
</head>
<body>
  <div id="out"></div>
  <script src="../assets/js/catalog.js"></script>
  <script src="../assets/js/cards.js"></script>
  <script>
    /*
     * Plantillas que tools/exportar-imagenes.js convierte en PNG, JPG y MP4.
     * Ábrela con ?art=post&p=redes&v=google (o solo, productos, og, reel) para verla.
     */
    var C = window.CATALOG, q = new URLSearchParams(location.search);
    var art = q.get("art") || "post";
    var p = C.getProduct(q.get("p")) || C.products[0];
    var v = C.getVariant(p, q.get("v")) || p.variants[0];
    var mark = '<svg viewBox="-6 -21 30 42">' + CARDS.mark(0, 0, 1, "currentColor") + "</svg>";
    var brand = '<div class="brand">' + mark + C.brand.name + "</div>";
    var html = "";

    if (art === "solo") {
      html = '<div class="solo">' + CARDS.card(p.id, v.id) + "</div>";
    } else if (art === "post") {
      var visual, title, cls = p.shape === "v" ? " v" : "";
      if (p.shape === "h" && p.variants.length > 1) {
        visual = '<div class="fan">' + p.variants.map(function (x, i, all) {
          var a = (i - (all.length - 1) / 2) * 12;
          return '<div class="shadow" style="transform:rotate(' + a + 'deg)">' + CARDS.card(p.id, x.id) + "</div>";
        }).join("") + "</div>";
        title = p.name.replace("Tarjeta NFC ", "Tarjeta ") + '<br><span class="hl">' + p.variants.map(function (x) { return x.name.toLowerCase(); }).join(", ").replace(/, ([^,]*)$/, " y $1") + ".</span>";
      } else {
        visual = '<div class="one shadow' + cls + '">' + CARDS.card(p.id, v.id) + "</div>";
        title = p.id === "google" ? "Reseñas de Google " + '<span class="hl">en un toque.</span>' : p.id === "redes" ? v.name + ' <span class="hl">en un toque.</span>' : p.name.replace("Tarjeta NFC ", "Tarjeta ") + '<br><span class="hl">con NFC.</span>';
      }
      html = '<div class="art post">' + brand + '<div class="tag">' + (p.stock ? "EN STOCK" : "BAJO PEDIDO") + "</div>" + visual +
        '<div class="copy' + cls + '"><h2>' + title + "</h2><p>Tarjeta NFC · " + p.material + " · Desde " + C.formatMoney(p.retail) + "</p></div></div>";
    } else if (art === "productos") {
      var vs = [["google", "negra"], ["redes", "instagram"], ["redes", "whatsapp"]], hs = [["metal", "dorada"], ["lisa", "negra"]];
      html = '<div class="art post">' + brand +
        '<div class="grid-v">' + vs.map(function (k) { return '<div class="shadow">' + CARDS.card(k[0], k[1]) + "</div>"; }).join("") + "</div>" +
        '<div class="grid-h">' + hs.map(function (k) { return '<div class="shadow">' + CARDS.card(k[0], k[1]) + "</div>"; }).join("") + "</div>" +
        '<div class="copy" style="bottom:70px"><h2 style="font-size:72px">Tarjetas NFC<br><span class="hl">para tu negocio.</span></h2><p>Menudeo y mayoreo · Envíos a todo México</p></div></div>';
    } else if (art === "reel") {
      html = '<div class="art reel">' + brand + '<div class="top">¿QUÉ ES NFC?</div>' +
        '<div class="nfc-scene"><div class="nfc-card"><div id="hero-card"></div></div>' +
        '<div class="nfc-burst"><i></i><i></i><i></i></div><div class="phone"><div class="phone-screen">' +
        '<div class="scr scr-idle"><span class="scr-time">9:41</span><span class="scr-date">jueves 30 de octubre</span><span class="scr-hint">Acerca a la tarjeta</span></div>' +
        '<div class="scr scr-open" id="phone-open"></div></div></div></div>' +
        '<div class="copy"><h2>Acerca el celular.<br><span class="hl">Listo.</span></h2><p>Tarjetas NFC · Sin apps · iPhone y Android</p></div></div>';
    } else {
      html = '<div class="art og">' + brand + '<div class="copy"><h2>Tarjetas NFC<br><span class="hl">para reseñas.</span></h2><p>Menudeo y mayoreo · Envíos a todo México</p></div>' +
        '<div class="one shadow">' + CARDS.card("google", "negra") + "</div></div>";
    }
    document.getElementById("out").innerHTML = html;

    // Video: el exportador llama a seek(ms) cuadro por cuadro; cada vuelta de 6 s cambia de plataforma.
    var reelSeq = [["google", "negra"], ["redes", "instagram"], ["redes", "whatsapp"], ["google", "blanca"], ["redes", "facebook"], ["redes", "tiktok"]], reelLoop = -1;
    window.seek = function (ms) {
      var loop = Math.floor(ms / 6000) % reelSeq.length;
      if (loop !== reelLoop) {
        reelLoop = loop;
        var rk = reelSeq[loop], rv = C.getVariant(C.getProduct(rk[0]), rk[1]);
        document.getElementById("hero-card").innerHTML = CARDS.card(rk[0], rk[1]);
        document.getElementById("phone-open").innerHTML = CARDS.screen(rv.screen);
        document.querySelector(".nfc-burst").style.setProperty("--burst", rv.color);
      }
      document.getAnimations().forEach(function (a) { a.pause(); a.currentTime = ms % 6000; });
    };
    if (art === "reel") window.seek(0);
  </script>
</body>
</html>
